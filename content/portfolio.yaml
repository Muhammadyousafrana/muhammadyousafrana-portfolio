      - Grew the project to 2.4k GitHub stars and 30+ external contributors.
      - Documented adapters for Stripe, Postgres, and edge runtimes with runnable examples.
  - id: realtime-collab-editor
    name: Realtime Collab Editor
    period: '2021'
    description: Collaborative rich-text editor demonstrating conflict-free real-time editing.
    bullets:
      - Implemented CRDT-based sync over WebSockets with offline reconciliation.
      - Built presence, cursors, and comment threads on a React front end.
      - Load-tested to 200 concurrent editors per document on a single node.
  - id: devflow-cli
    name: DevFlow CLI
    period: '2020'
    description: Command-line tool that scaffolds and automates common full-stack project workflows.
    bullets:
