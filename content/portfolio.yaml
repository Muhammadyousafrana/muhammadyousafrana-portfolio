# Portfolio content (structured facts).
#
# This file plus content/prose/*.md is the single source of resume/profile data.
# Run `bun run content:build` to regenerate shared/content.generated.ts, which the
# app, worker, and tests consume. The professional summary lives in
# content/prose/summary.md (long-form prose is authored as Markdown, facts here).
#
# Optional/empty sections are supported: leadership, certifications, awards, and
# skills.gaps may be omitted, and resumePdfPath may be left unset (its header
# button then hides). education is a list so multiple degrees are supported.

name: Jordan Ellis
title: Full-Stack Software Engineer

# Owner-facing identity + copy. These drive the AI proxy name, the header
# subtitle, hero/CTA copy, chat starter prompts, and the SEO/social tags.
# shortName is the casual first name used in UI copy and prompts (set it
# explicitly rather than parsing `name`, so preferred/compound names work).
assistantName: Robo-Jordan
shortName: Jordan
headerLabel: Full-Stack Portfolio

contact:
  email: jordan.ellis@example.com
  location: Austin, TX
  linkedinPath: linkedin.com/in/jordanellis

# SEO / social-card metadata injected into index.html at build time.
seo:
  title: Jordan Ellis | Full-Stack Software Engineer Portfolio
  description: Jordan Ellis's recruiter-ready software portfolio with project evidence, role-fit assessment, and AI-assisted experience Q&A.
  ogTitle: Jordan Ellis | Full-Stack Software Engineer
  ogDescription: Explore Jordan Ellis's software projects, technical experience, and AI-powered recruiter fit tools.
  themeColor: '#0f172a'

# resumePdfPath: /jordan_ellis_resume.pdf   # optional; unset -> header PDF button hidden

targetRoles:
  - Senior Full-Stack Engineer
  - Backend / Platform Engineer
  - Staff Software Engineer

# Suggested questions shown in the empty chat panel (at least one required).
starterPrompts:
  - What did Jordan build on the Northwind checkout platform?
  - How does the Open Commerce Toolkit show Jordan's open-source depth?
  - Where does Jordan have clear skill gaps for platform roles?

homepage:
  openToLabel: Open To Full-Stack, Backend, and Platform Roles
  roleFocus: Full-Stack + Backend Systems
  heroHeadline: Full-stack engineer shipping reliable web platforms from database to UI.
  ctaHeadline: Looking for a full-stack engineer who ships and owns what they build?
  ctaSubtext: Reach out about senior full-stack, backend, or platform roles where owning systems end to end matters.
  proofPoints:
    - sourceId: northwind-platform
      title: Platform Scale
      detail: Runs checkout orchestration for 3M+ monthly orders at 99.95% uptime on AWS ECS.
    - sourceId: open-commerce-toolkit
      title: Open Source Impact
      detail: Authored a headless commerce toolkit with 2.4k GitHub stars and 30+ contributors.
    - sourceId: brightledger-fullstack
      title: Full-Stack Depth
      detail: Shipped fintech reporting and ledger features end to end, from Postgres schema to React UI.

education:
  - school: University of Washington, Seattle, WA
    degree: BSc, Computer Science
    coursework:
      - Data Structures & Algorithms
      - Distributed Systems
      - Databases
      - Operating Systems
      - Web Systems Architecture
      - Human-Computer Interaction

experience:
  - id: northwind-platform
    company: Northwind Commerce
    role: Senior Software Engineer, Platform
    period: 2022 - Present
    description: Owns core commerce platform services and developer tooling for a high-traffic online marketplace.
    bullets:
      - Led migration of a monolith to TypeScript service modules on AWS ECS, cutting deploy time from 40 to 8 minutes.
      - Designed the checkout orchestration service handling 3M+ orders per month at 99.95% uptime.
      - Built an internal observability layer (structured logs, traces, SLO dashboards) adopted by six teams.
  - id: brightledger-fullstack
    company: BrightLedger
    role: Full-Stack Engineer
    period: 2019 - 2022
    description: Built customer-facing billing and reporting features for a B2B fintech SaaS.
    bullets:
      - Shipped a React and Node reporting suite that became the product's most-used feature.
      - Modeled double-entry ledger schemas in PostgreSQL and wrote the reconciliation jobs behind them.
      - Cut API p95 latency 35% by adding Redis caching and query-plan-driven index tuning.
  - id: heliolabs-engineer
    company: Helio Labs
    role: Software Engineer
    period: 2017 - 2019
    description: Early engineer at a developer-tools startup building CI and deployment automation.
    bullets:
      - Implemented the webhook pipeline that triggered builds for thousands of connected repositories.
      - Wrote the CLI and REST client libraries used by early adopters to script deployments.
      - Added end-to-end test coverage that reduced production incidents by roughly half.

