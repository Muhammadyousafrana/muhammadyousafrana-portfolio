    <!-- Apply the persisted/system theme before first paint so dark mode does not
         flash light on load. Mirrors the key and logic in src/hooks/use-theme.ts;
         useTheme still owns syncing and persistence after hydration. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var isDark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>

    <div id="root"></div>
    <script>
      window.addEventListener(
        'error',
        (event) => {
          const isOurAppError = event.filename && event.filename.startsWith(window.location.origin)
          if (isOurAppError) {
            navigator.sendBeacon(
              '/api/client-errors',
              JSON.stringify({
                message: event.message,
                url: window.location.href,
                userAgent: navigator.userAgent,
                source: event.filename,
                lineno: event.lineno,
                colno: event.colno,
                stack: event.error ? event.error.stack : null,
                timestamp: new Date().toISOString(),
              })
            )
          }
        },
        true
      )
    </script>
